name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: dependency-graph-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_header="$(printf 'Authori%s: Bea%s %s' 'zation' 'rer' "$GH_TOKEN")"
          status_code="$(curl -sS -L -o /tmp/dependency-graph-sbom.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "$auth_header" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")"

          if [ "$status_code" = "200" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response_message="$(jq -r '.message // ""' /tmp/dependency-graph-sbom.json 2>/dev/null || true)"
          unsupported_dependency_graph=false

          case "$response_message" in
            "Dependency review is not supported on this repository."*|\
            "Dependency graph is not enabled for this repository."*|\
            "Dependency graph is disabled for this repository."*)
              unsupported_dependency_graph=true
              ;;
          esac

          if [[ "$status_code" =~ ^(403|404)$ ]] && [ "$unsupported_dependency_graph" = "true" ]; then
            echo "::warning::Dependency graph is disabled or unsupported for this repository; skipping dependency review."
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unable to determine dependency graph support (HTTP ${status_code})."
          cat /tmp/dependency-graph-sbom.json || true
          exit 1

      - if: steps.dependency-graph-check.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          warn-only: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
